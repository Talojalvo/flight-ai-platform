# No env vars here: VITE_API_BASE_URL is baked into the static JS bundle at
# `docker build` time (frontend/Dockerfile ARG), not read at container
# runtime, so it cannot be configured through this Deployment. The frontend
# image referenced below must be built with:
#   --build-arg VITE_API_BASE_URL=http://flight-ai.local/api
# to match the Ingress host/path in 07-ingress.yaml (see run instructions).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: flight-ai-platform
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: flight-ai-platform
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
