# 02-secret.example.yaml is deliberately NOT listed here — the Secret is
# created imperatively instead (see the run instructions) so real API keys
# never get written into a file in this repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flight-ai-platform
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 03-flight-agent.yaml
  - 04-hotel-agent.yaml
  - 05-backend.yaml
  - 06-frontend.yaml
  - 07-ingress.yaml
