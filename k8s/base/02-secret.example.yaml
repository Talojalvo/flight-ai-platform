# TEMPLATE ONLY — not applied by kustomization.yaml and not meant to be
# edited with real values and committed. This repo is public, and a Secret
# manifest is just base64/plaintext at rest, not actually encrypted.
#
# Create the real Secret imperatively instead, so values never touch disk in
# the repo (see step 4 of the README/instructions):
#
#   kubectl create secret generic flight-ai-secrets \
#     --namespace flight-ai-platform \
#     --from-literal=GOOGLE_API_KEY=<your-real-key> \
#     --from-literal=IGNAV_API_KEY=<your-real-key> \
#     --from-literal=LITEAPI_API_KEY=<your-real-key>
#
# This file exists only to document which keys flight-ai-secrets must
# contain (see 01-configmap.yaml for the non-secret counterparts).
apiVersion: v1
kind: Secret
metadata:
  name: flight-ai-secrets
  namespace: flight-ai-platform
type: Opaque
stringData:
  GOOGLE_API_KEY: "REPLACE_ME"
  IGNAV_API_KEY: "REPLACE_ME"
  LITEAPI_API_KEY: "REPLACE_ME"
