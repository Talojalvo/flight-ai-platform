apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-agent
  namespace: flight-ai-platform
  labels:
    app: hotel-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-agent
  template:
    metadata:
      labels:
        app: hotel-agent
    spec:
      containers:
        - name: hotel-agent
          image: hotel-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: LITEAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-ai-secrets
                  key: LITEAPI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-agent
  namespace: flight-ai-platform
spec:
  selector:
    app: hotel-agent
  ports:
    - port: 8002
      targetPort: 8002
