apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-agent
  namespace: flight-ai-platform
  labels:
    app: flight-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-agent
  template:
    metadata:
      labels:
        app: flight-agent
    spec:
      containers:
        - name: flight-agent
          image: flight-agent:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: IGNAV_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-ai-secrets
                  key: IGNAV_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: flight-agent
  namespace: flight-ai-platform
spec:
  selector:
    app: flight-agent
  ports:
    - port: 8001
      targetPort: 8001
